<!doctype html>
<meta charset="utf-8">
<title>S-5 bench</title>
<p>crossOriginIsolated: <b id="coi"></b></p>
<p>
  build
  <select id="wasm">
    <option value="./build/scalar.wasm">scalar</option>
    <option value="./build/simd128.wasm">simd128</option>
  </select>
  model
  <select id="model">
    <option value="../fixtures/a1_standard.nam">a1_standard</option>
    <option value="../fixtures/a2_lite.nam">a2_lite</option>
  </select>
  IR
  <select id="ir">
    <option value="../fixtures/ir_48k.wav">ir_48k (native rate, no resample)</option>
    <option value="../fixtures/ir_44k1.wav">ir_44k1 (forces rubato to resample on load)</option>
  </select>
  <label><input type="checkbox" id="irtiming"> time load_ir (Task 8 Extra 1: one-off load cost, not per-block)</label>
  signal
  <select id="signal">
    <option value="0">steady</option>
    <option value="1">amp-decay (NOT a denormal test)</option>
    <option value="2">subnormal-tail (denormal probe)</option>
  </select>
  <label><input type="checkbox" id="census"> census only (prove subnormals, no timing)</label>
</p>
<button id="go">Run</button>
<pre id="out"></pre>
<script type="module">
// Query params, so a headless browser can drive this without a click:
//   ?auto=1        run on load
//   &reps=0        parity only, no timing run
//   &measured=N    override the measured-block count
//   &wasm=simd128  pick the artefact under web/build/ (default: the <select>)
//   &model=a2_lite
//   &ir=ir_44k1    IR under ../fixtures/ (default: the <select>, ir_48k). Task 8 Extra 1:
//                  ir_44k1 forces rubato's scalar (no simd128 path) resample on load.
//                  The parity gate ALWAYS loads ir_48k regardless of this -- see
//                  bench-worker.js's PARITY_IR comment.
//   &irtiming=1    also time load_ir alone, reps times, before the per-block reps
//                  below (a ONE-OFF LOAD cost; never conflate with the per-block figure)
//   &signal=0|1|2  0 steady, 1 amplitude-decay, 2 subnormal-tail (default 0)
//   &census=1      run the untimed subnormal census instead of the timing reps
const q = new URLSearchParams(location.search);
const out = document.getElementById("out");
document.getElementById("coi").textContent = String(self.crossOriginIsolated);
const run = () => {
  if (!self.crossOriginIsolated) {
    out.textContent = "NOT cross-origin isolated: timer is 100us, results are not quotable.\n";
  }
  const w = new Worker("./bench-worker.js", { type: "module" });
  w.onmessage = (e) => {
    const d = e.data;
    if (d.kind === "parity") {
      out.textContent +=
        `parity: residual ${d.residual.toFixed(2)} dB vs native-vs-native control ` +
        `${d.control.toFixed(2)} dB -> margin ${d.margin.toFixed(2)} dB ` +
        `${d.pass ? "(PASS, within 3 dB)" : "(FAIL, worse than the control by >3 dB)"}\n`;
    } else if (d.kind === "irload") {
      out.textContent +=
        `irload (one-off, NOT per-block) rep ${d.rep}: ${d.ir.replace(/.*\//, "")} load_ir ${d.ms.toFixed(3)} ms\n`;
    } else if (d.kind === "census") {
      out.textContent +=
        `census ${d.signal}: blocks ${d.blocks} | subnormal-out blocks ${d.subBlocks} ` +
        `(${(100 * d.subBlocks / d.blocks).toFixed(1)}%) | subnormal-out samples ${d.subSamples} | ` +
        `min |x| ${d.minAbs.toExponential(3)}
`;
    } else if (d.kind === "stats") {
      out.textContent +=
        `rep ${d.rep}: p50 ${d.p50.toFixed(2)}% | p99 ${d.p99.toFixed(2)}% | ` +
        `p99.9 ${d.p999.toFixed(2)}% | max ${d.max.toFixed(2)}% | ` +
        `estimator ${d.estimator.toFixed(2)}% | ${d.quotable ? "quotable" : "CONTAMINATED"}\n`;
    } else if (d.kind === "error") {
      out.textContent += `ERROR: ${d.message}\n`;
    } else {
      out.textContent += "done\n";
    }
  };
  w.onerror = (e) => { out.textContent += `WORKER ERROR: ${e.message}\n`; };
  // Mirrored into the title so `msedge --headless --dump-dom` picks the results up.
  // A headless browser cannot be read after the fact: --dump-dom fires long before the
  // render finishes. Under ?auto=1 each line is also beaconed to the dev server, which
  // 404s it but logs the query string -- that log is the transcript. Title mirroring is
  // kept for an interactive headless --dump-dom.
  setInterval(() => { document.title = "S5 " + out.textContent.split(String.fromCharCode(10)).join(" ~ "); }, 250);
  if (q.has("auto")) {
    const beacon = (t) => fetch("/__s5?" + encodeURIComponent(t)).catch(() => {});
    const inner = w.onmessage;
    w.onmessage = (e) => {
      inner(e);
      beacon(JSON.stringify(e.data));
      if (e.data.kind === "done" || e.data.kind === "error") beacon("FINISHED");
    };
  }
  w.postMessage({
    wasm: q.has("wasm") ? `./build/${q.get("wasm")}.wasm` : document.getElementById("wasm").value,
    model: `../fixtures/${q.get("model") || document.getElementById("model").value.replace(/.*\//, "").replace(/\.nam$/, "")}.nam`,
    ir: q.has("ir") ? `../fixtures/${q.get("ir")}.wav` : document.getElementById("ir").value,
    warmup: 5000,
    measured: Number(q.get("measured") || 100000),
    signal: Number(q.get("signal") ?? document.getElementById("signal").value),
    census: q.has("census") ? q.get("census") !== "0" : document.getElementById("census").checked,
    reps: q.has("reps") ? Number(q.get("reps")) : 5,
    irtiming: q.has("irtiming") ? q.get("irtiming") !== "0" : document.getElementById("irtiming").checked,
  });
};
document.getElementById("go").onclick = run;
if (q.has("auto")) run();
</script>
