[package]
name = "s2-ir-convolution"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "verify"
path = "src/bin/verify.rs"

[[bin]]
name = "sweep"
path = "src/bin/sweep.rs"

[[bin]]
name = "bench"
path = "src/bin/bench.rs"

[dependencies]
realfft = "3.5"
rustfft = "6.4"
rand = "0.8"
rand_pcg = "0.3"
core_affinity = "0.8"
mimalloc = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
