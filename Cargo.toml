# NFR-LIC-010's own partial sits beside the `license` key in [workspace.package] below, which is the
# manifest-metadata one of its three named checks; D-23.1's adjacency rule takes one anchor per
# tag, so it is annotated there rather than stacked here. Its licence-files-present check is
# `xtask identity`'s since M14 (`xtask/src/identity.rs`'s LICENCE_FILES).
# trace: FR-CFG-010, NFR-BUILD-010
[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
# Spikes are throwaway (§19: "not carried forward") and each pins its own Cargo.lock as a
# measurement record — they must not be swept into this workspace by Cargo's upward workspace
# discovery.
# crates/namir-nam/fuzz, crates/namir-state/fuzz and crates/namir-ir/fuzz are cargo-fuzz projects:
# each carries its own empty [workspace] table (the standard cargo-fuzz convention) so it's already
# its own workspace root, but this exclude is belt-and-suspenders against upward discovery, matching
# the spikes/ convention above.
exclude = [
    "spikes",
    "crates/namir-nam/fuzz",
    "crates/namir-state/fuzz",
    "crates/namir-ir/fuzz",
]

[workspace.package]
edition = "2024"
# trace-partial: NFR-LIC-010
# uncovered: NFR-LIC-010 — the method's SPDX-header check has no artifact: only two tracked files
# uncovered: under crates/ carry a header, and making the check meaningful means putting one on
# uncovered: every file, which is NFR-LIC-060's (a Should's) work — accepted on that basis by the
# uncovered: requirement's own Consequence note (FRS, 2026-08-12); closes M8
license = "MIT OR Apache-2.0"
# D-18.4 (M13): Namir publishes **nothing** to crates.io. Twelve of the fourteen crates are
# implementation details of one product, `namir-clap` is a cdylib nothing can depend on as a
# library even in principle, and `namir-fixtures` is test tooling for this repository's own
# fixtures -- fourteen public maintenance obligations serving zero users. Set here and inherited
# per crate (`publish.workspace = true`) so the policy has one home rather than fourteen.
#
# This does not change what `cargo publish` does today, it changes *why* it fails. Before M13 no
# path dependency carried a `version`, which `cargo publish` rejects on its own; that was an
# incidental blocker that would have vanished the moment someone added versions for an unrelated
# reason. M13 adds those versions deliberately (see any crate's path dependencies), which makes
# this line the thing actually holding the policy -- and keeps reversing it a one-key change per
# manifest rather than an audit, because a policy decision should stay revisitable.
#
# Accepted costs, stated: no docs.rs, and no `cargo install namir`. D-18.3's installers and
# archives are the distribution channel instead, which is the right one for an application with a
# GUI and a plugin artifact anyway.
publish = false
# NFR-PORT-010: MSRV stated in the manifest and enforced in CI (the CI job itself is the next
# stage of M1, not built here). Pinned to the toolchain actually in use rather than an old floor:
# this is a brand-new project with zero external users yet, and edition 2024 already forces a
# fairly recent compiler, so there is nothing gained by floor-testing against something older
# than what's installed. Per NFR-PORT-010, once set this must not be raised in a patch release.
rust-version = "1.97"

[workspace.lints.rust]
unsafe_code = "forbid" # D-5.3 default; namir-platform, namir-clap and SIMD kernels override per-crate.
# NFR-DOC-020: "every public API item in every published crate shall carry documentation,
# enforced mechanically." `warn`, not `deny`/`forbid`, because this is being retroactively added
# across five-plus existing crates in one pass — a hair-trigger `deny` would break the next
# unrelated PR that adds one `pub` item without knowing this lint now exists mid-milestone. Every
# crate this pass touches is made warning-clean anyway (the `-D warnings` clippy gate makes that
# true in practice today), so `warn` costs nothing now and just avoids being a landmine later.
# trace: NFR-DOC-020
missing_docs = "warn"
