# cargo-deny configuration.
#
# NFR-LIC-020 (Must): "Every dependency, transitively, shall carry a licence compatible with
# distribution under both MIT and Apache-2.0. Copyleft licences (GPL, AGPL, LGPL where static
# linking applies) shall be rejected." The `[licenses]` section below is this crate's
# mechanical enforcement of that requirement (D-18.1: `cargo-deny` gates CI). See
# docs/02-architecture.md §17's dependency register for the hand-verified facts this mirrors;
# unlike that table, this file is re-checked on every CI run rather than maintained by hand.
#
# `[sources]` is left close to `cargo deny init`'s own defaults — this project has no unusual
# source requirement yet (see NFR-LIC-050 for the *separate*, not-yet-built check over test-asset
# licences, which this file does not cover). `[bans]` carries M7's network-free deny-list — see
# its own comment below.
#
# trace: NFR-LIC-020, NFR-LIC-040

[graph]
all-features = true

[licenses]
version = 2
# Every licence actually observed in this workspace's dependency tree today (verified by
# `cargo deny check licenses` against Cargo.lock, 2026-08-05), plus a small set of other
# unambiguously permissive SPDX identifiers a future dependency might carry without needing a
# deny.toml edit first. `[licenses] version = 2` denies any licence not on this list by default
# (including an unrecognised/unlicensed crate) -- copyleft licences are never added here, which
# is what actually enforces NFR-LIC-020's rejection rather than any explicit deny-list of names.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "MIT-0",
    "Unlicense",
    # M6's namir-ui pulls in D-15.1/D-15.2's egui/egui-baseview/baseview stack for the first time
    # in the main workspace (spikes/s3-egui-baseview and spikes/s4-clack-clap already exercised it,
    # but spikes carry their own pinned Cargo.lock and are excluded from this workspace, so this is
    # the first time `cargo deny check` has actually seen these three). None are copyleft, so none
    # conflict with NFR-LIC-020's rejection criterion, even though none are literally "MIT OR
    # Apache-2.0":
    #  - BSL-1.0 (Boost Software License 1.0): OSI-approved, FSF-free, permissive -- via
    #    `clipboard-win`/`error-code` (egui-baseview's clipboard dependency, `copypasta`).
    #  - OFL-1.1 (SIL Open Font License) and Ubuntu-font-1.0: font-specific permissive licences
    #    covering `epaint_default_fonts`' bundled glyph data (egui's `default_fonts` feature, on by
    #    default) -- both licences explicitly permit embedding the font in and distributing it with
    #    software under any licence; they restrict only redistributing/selling the *font file*
    #    itself under a different name, which this workspace never does.
    "BSL-1.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
]
confidence-threshold = 0.8

# The `deny` list below is FR-ERR-060's whole build-time check; its partial is annotated here rather
# than stacked on that list's own tag, D-23.1's adjacency rule taking one anchor per tag and
# FR-ERR-070/NFR-SEC-030 keeping the plain tag immediately above `deny`.
# trace-partial: FR-ERR-060
# uncovered: FR-ERR-060 — the method's "build-time check that no network-capable dependency is
# uncovered: linked" is a by-name deny list its own comment calls deliberately non-exhaustive, and
# uncovered: nothing detects direct std::net use in a first-party crate, which would open an
# uncovered: outbound connection with Cargo.lock untouched and the gate green; closes M8
[bans]
multiple-versions = "warn"
# Default ("allow", matching `cargo deny init`'s own template): this workspace's own crates
# depend on each other via bare `path = "..."` entries with no version requirement, which
# cargo-deny's wildcard lint otherwise flags the same way it would flag a genuinely unpinned
# external dependency. "deny" here would fail on every intra-workspace edge, which is not what
# NFR-LIC-020 or D-5.2 are trying to catch (that's the layering lint's job, in `xtask`).
wildcards = "allow"
# M7 (D-18.2/FR-ERR-070.5): "a network-free build configuration is a permanent CI target" and
# FR-ERR-070's own *Verify* method is S -- "a build-time check that no network-capable dependency
# is linked into the 1.0 binaries." No network client of any kind exists in this workspace today
# (RD-1/Tone3000 is explicitly post-1.0), so this list is a standing assertion that stays true
# rather than a fix for a real violation. `cargo deny check bans` (wired into
# .github/workflows/ci.yml's `network-free` job) fails the build the moment any of these -- or a
# transitive dependency pulling one of them in -- enters Cargo.lock. Named by crate, not by
# category, because cargo-deny has no built-in "networking" classification to key off of; this
# list is deliberately not exhaustive of every crate that could conceivably open a socket, just of
# the well-known, commonly-pulled-in HTTP/TLS/DNS/async-runtime-networking crates most likely to
# arrive as a transitive dependency of something else added later without anyone specifically
# choosing to add networking. Extend, don't replace, if/when RD-1 adds a real network client behind
# its own feature flag (FR-ERR-070's own remaining sub-clauses govern how that must be gated).
#
# trace: FR-ERR-070, NFR-SEC-030
deny = [
    { name = "reqwest" },
    { name = "hyper" },
    { name = "hyper-util" },
    { name = "ureq" },
    { name = "curl" },
    { name = "curl-sys" },
    { name = "native-tls" },
    { name = "openssl" },
    { name = "openssl-sys" },
    { name = "rustls" },
    { name = "tokio" },
    { name = "async-std" },
    { name = "mio" },
    { name = "socket2" },
    { name = "trust-dns-resolver" },
    { name = "hickory-resolver" },
    { name = "h2" },
    { name = "tonic" },
    { name = "tungstenite" },
    { name = "quinn" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# D-13.4 (M11): the one non-registry source in the tree -- the Namir-maintained `cpal` fork that
# adds WASAPI exclusive mode (FR-IO-020), consumed by `namir-app` and pinned by commit hash in
# `crates/namir-app/Cargo.toml`. `unknown-git = "deny"` above is the default posture and is doing
# its job, so this is a narrow, named allowance for exactly this repository rather than the blanket
# `allow-git = []` relaxation D-13.4 rules out: any *other* git source still fails this gate.
#
# Risk R-10 is what this line costs. A git dependency weakens NFR-SEC-040's reproducible-build
# ambition in a way a crates.io dependency does not, and a maintained fork has to be rebased as
# upstream moves. The mitigations R-10 names are the commit pin (in the manifest, not here -- this
# list allows the repository, not a revision) and, if the pin ever proves insufficient, vendoring
# the fork into the tree. If the change is accepted upstream, D-13.4 reverts to a version bump and
# this line is deleted along with it.
allow-git = ["https://github.com/ErwanLegrand/cpal"]
