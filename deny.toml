# cargo-deny configuration.
#
# NFR-LIC-020 (Must): "Every dependency, transitively, shall carry a licence compatible with
# distribution under both MIT and Apache-2.0. Copyleft licences (GPL, AGPL, LGPL where static
# linking applies) shall be rejected." The `[licenses]` section below is this crate's
# mechanical enforcement of that requirement (D-18.1: `cargo-deny` gates CI). See
# docs/02-architecture.md §17's dependency register for the hand-verified facts this mirrors;
# unlike that table, this file is re-checked on every CI run rather than maintained by hand.
#
# `[bans]`/`[sources]` are left close to `cargo deny init`'s own defaults — this project has no
# unusual source or duplicate-version requirements yet (see NFR-LIC-050 for the *separate*,
# not-yet-built check over test-asset licences, which this file does not cover).

[graph]
all-features = true

[licenses]
version = 2
# Every licence actually observed in this workspace's dependency tree today (verified by
# `cargo deny check licenses` against Cargo.lock, 2026-08-05), plus a small set of other
# unambiguously permissive SPDX identifiers a future dependency might carry without needing a
# deny.toml edit first. `[licenses] version = 2` denies any licence not on this list by default
# (including an unrecognised/unlicensed crate) -- copyleft licences are never added here, which
# is what actually enforces NFR-LIC-020's rejection rather than any explicit deny-list of names.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "MIT-0",
    "Unlicense",
    # M6's namir-ui pulls in D-15.1/D-15.2's egui/egui-baseview/baseview stack for the first time
    # in the main workspace (spikes/s3-egui-baseview and spikes/s4-clack-clap already exercised it,
    # but spikes carry their own pinned Cargo.lock and are excluded from this workspace, so this is
    # the first time `cargo deny check` has actually seen these three). None are copyleft, so none
    # conflict with NFR-LIC-020's rejection criterion, even though none are literally "MIT OR
    # Apache-2.0":
    #  - BSL-1.0 (Boost Software License 1.0): OSI-approved, FSF-free, permissive -- via
    #    `clipboard-win`/`error-code` (egui-baseview's clipboard dependency, `copypasta`).
    #  - OFL-1.1 (SIL Open Font License) and Ubuntu-font-1.0: font-specific permissive licences
    #    covering `epaint_default_fonts`' bundled glyph data (egui's `default_fonts` feature, on by
    #    default) -- both licences explicitly permit embedding the font in and distributing it with
    #    software under any licence; they restrict only redistributing/selling the *font file*
    #    itself under a different name, which this workspace never does.
    "BSL-1.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
# Default ("allow", matching `cargo deny init`'s own template): this workspace's own crates
# depend on each other via bare `path = "..."` entries with no version requirement, which
# cargo-deny's wildcard lint otherwise flags the same way it would flag a genuinely unpinned
# external dependency. "deny" here would fail on every intra-workspace edge, which is not what
# NFR-LIC-020 or D-5.2 are trying to catch (that's the layering lint's job, in `xtask`).
wildcards = "allow"
# No specific crates banned today -- NFR-LIC-020's copyleft rejection is enforced by the
# `[licenses]` section above (nothing GPL/AGPL/LGPL-licensed is in `allow`, and cargo-deny denies
# any licence not on that list by default), not by naming crates here.
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
