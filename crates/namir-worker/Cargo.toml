[package]
name = "namir-worker"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# D-18.4: Namir publishes nothing to crates.io. Inherited so the policy has one home.
publish.workspace = true

# D-5.3: this crate is NOT on the unsafe carve-out list (namir-platform, namir-clap, SIMD kernel
# modules), so it takes the workspace lints unchanged -- `unsafe_code = "forbid"`. Everything here
# is safe Rust: the thread pool is std Mutex/Condvar, the cache is a std Mutex<HashMap>, and the
# rings' unsafe lives in `rtrb`, behind namir-engine's own wrappers.
[lints]
workspace = true

[dependencies]
namir-core = { path = "../namir-core", version = "0.1.0" }
namir-nam = { path = "../namir-nam", version = "0.1.0" }
namir-ir = { path = "../namir-ir", version = "0.1.0" }
namir-engine = { path = "../namir-engine", version = "0.1.0" }
namir-library = { path = "../namir-library", version = "0.1.0" }
namir-state = { path = "../namir-state", version = "0.1.0" }
# namir-platform, taken for a genuine reason (M6), not speculatively: `library.rs`'s
# `LibraryService::open_default` is the one place both `namir-app` and `namir-clap` bootstrap
# their default library location, and that location is `namir_platform::config_dir()`-relative.
# Before this it had a real, concrete use case; D-5.1 permitting it was not by itself a reason to
# take it, matching the reasoning the note below still gives for namir-params/namir-dsp staying
# absent.
namir-platform = { path = "../namir-platform", version = "0.1.0" }
# Deliberately absent, each a decision rather than an oversight:
#  - no async runtime: D-7.1 rejects tokio et al. explicitly ("it brings a scheduler, a large
#    dependency surface and no benefit for a workload that is a handful of long CPU/IO tasks");
#  - no thread-pool or channel crate: D-7.1's pool is at most two threads and is ~100 lines of
#    std Mutex/Condvar, which is less code than the dependency's own feature flags;
#  - no `rtrb`: namir-engine owns the ring types and hands out its own endpoints, so the
#    dependency stays confined to the one crate that needs it;
#  - no namir-params/namir-dsp: D-5.1 permits both, which is not a reason to take them.
#    `recall.rs` reads a `namir_params::ParamDescriptor`'s `.id` field through
#    `namir_state::ParamValues::iter()`'s own return type without ever naming `namir_params`
#    itself, the same way `library.rs` reaches `namir-state` indirectly through `namir-library`.

[dev-dependencies]
namir-fixtures = { path = "../namir-fixtures", version = "0.1.0" }
hound = "3.5"
# NFR-RT-010's three-axis stress test (tests/rt_stress.rs) needs D-7.5's allocation-detecting
# harness, duplicated here rather than reused from `namir-engine::rt_harness`: that module is
# `#[cfg(test)]`-private to its own crate, and a `#[global_allocator]` can only be installed once
# per *binary* regardless -- an integration test file is its own binary, so this is legitimate
# rather than a second copy of the same installation colliding with the first. Dev-dependency
# only, same version/features as every other crate's identical `rt_harness.rs` installation.
assert_no_alloc = { version = "1.1.2", default-features = false, features = ["warn_debug", "warn_release"] }
# NFR-PERF-050's load-time benchmark (benches/resource_load.rs) pins away from CPU 0/2, same
# reasoning and same crate/version as namir-engine's/namir-nam's/namir-ir's identical D-2.1-pinned
# benches -- a wall-clock figure (D-2.5) is still worth a quiet core.
core_affinity = "0.8"

[[bench]]
name = "resource_load"
harness = false
