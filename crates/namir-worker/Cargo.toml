[package]
name = "namir-worker"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# D-5.3: this crate is NOT on the unsafe carve-out list (namir-platform, namir-clap, SIMD kernel
# modules), so it takes the workspace lints unchanged -- `unsafe_code = "forbid"`. Everything here
# is safe Rust: the thread pool is std Mutex/Condvar, the cache is a std Mutex<HashMap>, and the
# rings' unsafe lives in `rtrb`, behind namir-engine's own wrappers.
[lints]
workspace = true

[dependencies]
namir-core = { path = "../namir-core" }
namir-nam = { path = "../namir-nam" }
namir-ir = { path = "../namir-ir" }
namir-engine = { path = "../namir-engine" }
namir-library = { path = "../namir-library" }
# Deliberately absent, each a decision rather than an oversight:
#  - no async runtime: D-7.1 rejects tokio et al. explicitly ("it brings a scheduler, a large
#    dependency surface and no benefit for a workload that is a handful of long CPU/IO tasks");
#  - no thread-pool or channel crate: D-7.1's pool is at most two threads and is ~100 lines of
#    std Mutex/Condvar, which is less code than the dependency's own feature flags;
#  - no `rtrb`: namir-engine owns the ring types and hands out its own endpoints, so the
#    dependency stays confined to the one crate that needs it;
#  - no namir-params/namir-dsp/namir-platform: D-5.1 permits all three, which is not a reason to
#    take them. namir-state is M5's *other* new crate and does not exist yet; `library.rs` reaches
#    it indirectly (`namir-library` already depends on it) rather than pulling it in a second time
#    for no code this crate needs on its own.

[dev-dependencies]
namir-fixtures = { path = "../namir-fixtures" }
hound = "3.5"
