[package]
name = "namir-nam"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
namir-core = { path = "../namir-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# R-4: vectorizes the WaveNet's AXPY-shaped inner loops (see wavenet.rs's Decision/Rationale
# note near `axpy`). Safe public API only (Zlib OR Apache-2.0 OR MIT, all on deny.toml's allow
# list) -- this crate forbids unsafe code (workspace lint, D-5.3) and `wide` never requires one.
wide = "1.6"

[dev-dependencies]
namir-fixtures = { path = "../namir-fixtures" }
# M10: reads the committed golden-reference WAV pairs (`tests/golden/`) FR-NAM-030's real-C++-
# reference comparison needs -- see `tests/golden_reference.rs`. Pinned to the same "3.5" every
# other hound consumer in this workspace uses (namir-fixtures, namir-ir, namir-worker), so there
# is only one hound version in the dependency tree.
hound = "3.5"
# `warn_release` alongside `warn_debug`: pre-existing gap found during M3's verification pass --
# with `warn_debug` alone, `reset_violation_count`/`violation_count` are compiled out under
# `cargo test --release` (`cfg(any(all(warn_debug, debug_assertions), all(warn_release,
# not(debug_assertions))))` is false in that profile), so `rt_harness` fails to *compile* in
# release mode, not just fails a test. Both features only affect this dev-dependency's own
# count-don't-abort behaviour (never linked into a release build of this crate), so enabling both
# is free.
assert_no_alloc = { version = "1.1.2", default-features = false, features = ["warn_debug", "warn_release"] }
# Pins the R-4 benchmark to one core (D-2.1), same crate and version the S-1 spike's own
# bench.rs used -- see benches/wavenet_inner_loops.rs.
core_affinity = "0.8"

[[bench]]
name = "wavenet_inner_loops"
harness = false

# M10 Phase 4(b): FR-NAM-120 / NFR-PERF-010 LSTM cost curve across the real 67-model set's shape
# grid (docs/manual-tests/fr-nam-020-real-lstm-models.md) -- see benches/lstm_inner_loops.rs's own
# doc comment. Mirrors wavenet_inner_loops's shape exactly: plain fn main, no criterion.
[[bench]]
name = "lstm_inner_loops"
harness = false
