[package]
name = "namir-platform"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# Not `[lints] workspace = true`, deliberately: the workspace's `[workspace.lints.rust]` sets
# `unsafe_code = "forbid"` (root Cargo.toml), and `forbid` is designed to resist a later local
# `#![allow(unsafe_code)]` — that's the whole point of using `forbid` there instead of `deny` for
# every other crate (D-5.3). `namir-platform` is one of the two crates (with `namir-clap`) D-5.3
# explicitly carves out to legitimately need `unsafe` for CPU-control-register access (D-7.4's
# denormal guard). So this crate declares its own `[lints.rust]` table with `unsafe_code = "deny"`
# instead: still strict by default (any stray `unsafe` outside the one module that opts back in
# still fails the build), but `deny` — unlike `forbid` — permits that one module's scoped
# `#![allow(unsafe_code)]`, which is exactly NFR-QUAL-070 / D-5.3's "confined to designated
# modules" intent.
[lints.rust]
unsafe_code = "deny"
# NFR-DOC-020, matching the workspace's `missing_docs = "warn"` (root Cargo.toml) — not inherited
# automatically since this crate has its own `[lints.rust]` table instead of `[lints] workspace =
# true` (see this table's own comment above for why).
missing_docs = "warn"

[dependencies]
namir-core = { path = "../namir-core" }
