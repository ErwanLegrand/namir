[package]
name = "namir-state"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# D-18.4: Namir publishes nothing to crates.io. Inherited so the policy has one home.
publish.workspace = true

[lints]
workspace = true

[dependencies]
namir-core = { path = "../namir-core", version = "0.1.0" }
namir-params = { path = "../namir-params", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# FR-STATE-080's embedded model/IR data (base64 inside the JSON document, D-11.1's format).
# Checked against this workspace's adoption bar (the criteria that admitted `rtrb`, §17):
# MIT OR Apache-2.0 (already on deny.toml's allow list), zero transitive dependencies, no build
# script, MSRV 1.71 (far below this workspace's 1.97), no_std-capable. `default-features = false`
# with only the `alloc` feature: the default `simd-unsafe` feature is not needed at the volumes
# this crate handles and this way the dependency carries no unsafe SIMD path at all, not merely
# one this crate doesn't call into.
base64 = { version = "0.23", default-features = false, features = ["alloc"] }
# Deliberately absent, each a decision rather than an oversight:
#  - no filesystem/path-resolution crate: D-5.1 forbids this crate from touching a filesystem at
#    all (resolve.rs's FileResolver port is the seam; namir-library implements it, namir-worker
#    drives it -- see docs/02-architecture.md D-11.3's M5 consequence note).
#  - no namir-nam/namir-ir: this crate never parses a model or IR, only records a hash/path
#    triple identifying one (D-11.3). xtask layering's LAYERING_TABLE enforces this.
#  - `serde_json`'s `preserve_order` feature is not enabled: D-11.1 wants *sorted*, not
#    insertion-order, keys -- serde_json::Map is a BTreeMap without it, which is what makes
#    stable key ordering free rather than something this crate has to implement.

[dev-dependencies]
namir-fixtures = { path = "../namir-fixtures", version = "0.1.0" }
