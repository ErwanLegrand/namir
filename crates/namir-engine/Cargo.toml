[package]
name = "namir-engine"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
namir-core = { path = "../namir-core" }
namir-params = { path = "../namir-params" }
namir-dsp = { path = "../namir-dsp" }
namir-nam = { path = "../namir-nam" }
# D-9.2/9.3: the Nam stage wraps `namir-nam`'s model with a block-based resampler around it, per
# this crate's own layering (D-5.1: namir-engine may depend on nam but nam may not depend on an
# external resampler itself -- resampling is a stage concern, not a model-inference concern).
rubato = "0.16"
# The Ir stage wraps `namir-ir`'s convolver (`namir-ir` did not exist yet when this crate's
# dependency list was last edited -- added here as this M2 wave's one exception to "only touch
# your own stage file").
namir-ir = { path = "../namir-ir" }
# M4: D-7.2's SPSC command ring and D-8.1's return ring (see src/ring.rs's module doc for the full
# Decision/Rationale block). Same composition move src/rt_harness.rs documents for
# `assert_no_alloc`: this crate's `unsafe_code = "forbid"` (D-5.3, workspace lint) cannot be
# relaxed by a nested `#[allow]`, and a wait-free SPSC queue carrying `Arc<Prepared*>` cannot be
# written in safe Rust -- so the unsafe lives in the dependency, not here. Verified against this
# project's own constraints before adoption: MIT OR Apache-2.0 (NFR-LIC-020, already on
# deny.toml's allow-list), **zero** transitive dependencies, no build script, `no_std`-capable and
# pure Rust (so it cross-compiles for NFR-PORT-030's aarch64 mobile targets), and its own
# `rust-version = "1.38"` is far below this workspace's 1.97 MSRV (NFR-PORT-010).
rtrb = "0.3.4"

[dev-dependencies]
# D-7.5's RT-allocation test harness (see src/rt_harness.rs's module doc for why an external
# crate is used here rather than a hand-rolled `GlobalAlloc`: this crate's `unsafe_code =
# "forbid"` rules out implementing that trait ourselves). Dev-dependency only, so it is never
# linked into a release build of this crate.
# `warn_release` alongside `warn_debug`: pre-existing gap found during M3's verification pass --
# with `warn_debug` alone, `rt_harness` fails to *compile* under `cargo test --release` (see the
# identical fix and rationale in `namir-nam`'s Cargo.toml). Dev-dependency only, so enabling both
# features costs nothing in a release build of this crate.
assert_no_alloc = { version = "1.1.2", default-features = false, features = ["warn_debug", "warn_release"] }
# The Ir stage's own tests synthesize small in-memory WAV impulse responses, the same pattern
# `namir-ir`'s own test suite uses (see `stages/ir.rs`'s test module). Also used by
# `benches/six_stage_chain.rs` to build its own synthetic 2 s stereo IR the same way.
hound = "3.5"
# M3's exit-criterion benchmark (`benches/six_stage_chain.rs`): D-19.1's generated-not-captured
# "standard" WaveNet model and the `decaying_noise` IR fixture. Dev-dependency only, matching
# `namir-nam`'s/`namir-ir`'s identical dev-only use of this crate for their own R-4/R-8 benches
# -- `namir-fixtures` is test/bench tooling (`xtask`'s layering table exempts it entirely), never
# a normal dependency.
namir-fixtures = { path = "../namir-fixtures" }
# Pins `benches/six_stage_chain.rs` to one core (D-2.1), same crate and version
# `namir-nam`'s/`namir-ir`'s own D-2.1-pinned benches use.
core_affinity = "0.8"
# NFR-RT-030's benchmark (`benches/denormal_guard.rs`) needs `namir_platform::DenormalGuard` to
# engage FTZ/DAZ around measured blocks. D-5.1's layering table (`xtask/src/layering.rs`) does not
# permit `namir-engine` to depend on `namir-platform` as a *normal* dependency -- `namir-engine`
# must stay build-order-independent of the product-shell layer that owns platform concerns -- but
# the layering scanner only inspects normal/build edges (see that module's own doc comment) and
# exempts dev-dependencies outright, the same carve-out `namir-nam`'s dev-dependency on
# `namir-fixtures` already relies on for its own parity tests. Dev-dependency only, so this is
# never linked into a release build of this crate, and `cargo run -p xtask -- layering` does not
# see this edge at all.
namir-platform = { path = "../namir-platform" }

[[bench]]
name = "six_stage_chain"
harness = false

# Diagnostic companion to `six_stage_chain`: attributes that benchmark's assembled figure to
# individual stages (gate/trim/eq/out had never been measured in isolation before M3's close-out).
# Gates nothing -- see the file's own doc comment.
[[bench]]
name = "per_stage_cost"
harness = false

# Diagnostic (M3): is the chain's p99.9 tail code-driven or environmental? See the file's
# own doc comment. Gates nothing.
[[bench]]
name = "tail_structure"
harness = false

# R-7 (M4): the crossfade's transient cost, which D-8.1's own consequence clause says "the
# benchmark measures" -- and which nothing could measure until a handover could be driven across a
# real ring. Gates nothing by itself; see the file's own doc comment for the D-2.4 run procedure.
[[bench]]
name = "handover_crossfade"
harness = false

# M6: NFR-RT-030's verification (Verify method B), open since M1 built `DenormalGuard` with no
# audio path ever acquiring it and no benchmark ever built to check it -- see the file's own doc
# comment for the full history and methodology. Gates NFR-RT-030 itself, not NFR-PERF-010.
[[bench]]
name = "denormal_guard"
harness = false
