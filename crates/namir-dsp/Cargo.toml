[package]
name = "namir-dsp"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# D-18.4: Namir publishes nothing to crates.io. Inherited so the policy has one home.
publish.workspace = true

[lints]
workspace = true

[dependencies]
namir-core = { path = "../namir-core", version = "0.1.0" }

[dev-dependencies]
# D-7.5's RT-allocation test harness (see src/rt_harness.rs's module doc for why an external
# crate is used here rather than a hand-rolled `GlobalAlloc`: this crate's `unsafe_code =
# "forbid"` rules out implementing that trait ourselves). Dev-dependency only, so it is never
# linked into a release build of this crate.
# `warn_release` alongside `warn_debug`: pre-existing gap found during M3's verification pass --
# this crate was missed when the sibling crates were fixed. With `warn_debug` alone, `rt_harness`
# fails to *compile* under `cargo test --release` (see the identical fix and rationale in
# `namir-nam`'s Cargo.toml). Dev-dependency only, so enabling both features costs nothing in a
# release build of this crate.
assert_no_alloc = { version = "1.1.2", default-features = false, features = ["warn_debug", "warn_release"] }
