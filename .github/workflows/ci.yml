# CI gates named in docs/02-architecture.md D-18.1, sequenced/scoped per
# docs/03-implementation-roadmap.md §5 (M1). Every job here is scoped to what M1 can gate today;
# see each job's own comments for exactly which slice of D-18.1 it covers.
#
# D-18.2's network-free build gate (the `network-free` job below) landed at M7, exactly as
# predicted here: there was no network feature for a flag to gate before M7, so this waited rather
# than being built speculatively against a guessed-at shape.
#
# `cargo-fuzz` needs a nightly toolchain and a bounded-time run, which reads more cleanly as its
# own file than as one more job squeezed into a stable-toolchain matrix -- see fuzz.yml.

name: CI

on:
  push:
    branches: [trunk]
  pull_request:
    branches: [trunk]

# Principle of least privilege for the GITHUB_TOKEN (flagged by CodeQL's "Workflow does not
# contain permissions" check): every job **in this workflow** only checks out the repo, builds, and
# reads -- none of them needs to write to the repo, open a PR comment, or touch releases -- so a
# workflow-wide `contents: read` covers all of them, with no per-job override needed.
#
# M13: this was written as a claim about the project and is now scoped to this file, because it
# stopped being true of the project the moment `release.yml` landed. That workflow creates a GitHub
# Release and therefore needs `contents: write` -- granted there to the one job that publishes, over
# the same workflow-wide `contents: read` default this file uses. Nothing about *this* file changes.
permissions:
  contents: read

jobs:
  # Covers D-18.1's "build + test on Windows/Linux/macOS" and "formatting and lints as errors"
  # (NFR-QUAL-060). Also covers D-18.1's "the RT-allocation harness": D-7.5's harness is just
  # #[cfg(test)] tests inside namir-engine (and the crates that exercise it) that run as part of
  # `cargo test --workspace` below -- there is no separate RT-harness step because there is no
  # separate RT-harness binary; do not read its absence as a missing gate.
  #
  # NFR-BUILD-020's own partial sits beside the build/test steps below, which are the commands its
  # gap is about; D-23.1's adjacency rule takes one anchor per tag, so the three ids this site
  # carried until M9a are now annotated separately rather than stacked here.
  #
  # trace: NFR-QUAL-050, NFR-QUAL-060
  build-test:
    name: build + test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # M6: `namir-app` takes `cpal` (D-13.1), and `cpal`'s ALSA backend (`alsa-sys`) needs real
      # ALSA development headers at build time -- its own `build.rs` shells out to `pkg-config
      # --probe alsa` and panics with an explicit "install libasound2-dev" message if that fails.
      # `windows-latest`/`macos-latest` use `cpal`'s WASAPI/CoreAudio backends instead, which link
      # against OS frameworks already present on those images, so this step is Linux-only. Not
      # verified against a real GitHub-hosted runner (no CI execution available while authoring
      # this crate) -- verified only against `alsa-sys-0.4.0`'s own `build.rs` source, which names
      # this exact package for exactly this failure.
      - name: Install ALSA development headers (Linux only, for cpal's alsa-sys)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy --workspace --all-targets -- -D warnings
        # S-4 (docs/02-architecture.md §19) found that on Windows/MSVC, the linker writes to
        # stdout and Cargo surfaces this as a `linker_messages` warning on every `cdylib` build,
        # which a bare `-D warnings` gate would then fail on. There is no `cdylib` target in the
        # workspace yet (namir-clap, the only crate that will produce one, is M6), so this cannot
        # actually fire today -- nothing to allow-list yet. Left here as a pointer so whoever
        # adds namir-clap doesn't have to rediscover S-4's finding: when that crate lands, this
        # step will need `-A linker_messages` (or an equivalent explicit allow) for Windows
        # specifically, not a workaround, and not silence-by-ignoring-all-warnings.
        run: cargo clippy --workspace --all-targets -- -D warnings

      # trace-partial: NFR-BUILD-020
      # uncovered: NFR-BUILD-020 — M12 closed the "document" half and M14's `xtask ci-commands`
      # uncovered: closes the drift half: every command README.md documents is run by this file and
      # uncovered: every xtask subcommand this file runs is documented there, checked in both
      # uncovered: directions on every pull request. What is left is the requirement's own scope
      # uncovered: word: "every product configuration on every supported platform" is unspanned —
      # uncovered: no job installs either product at its documented install path on Windows or
      # uncovered: macOS or loads the plugin in a real host (clap-validator and the in-process
      # uncovered: host-ext-tests are neither an install nor a DAW), and docs/user-guide.md's
      # uncovered: per-platform install and run instructions are read by no check; closes M8
      - name: cargo build --workspace --all-targets
        run: cargo build --workspace --all-targets

      - name: cargo test --workspace
        run: cargo test --workspace

      # M9b (D-18.7). `namir-clap`'s `host-ext-tests` feature is **non-default**, so the step above
      # does not compile the tests behind it -- the in-process CLAP host tests that observe the
      # plugin's audio-ports/params/state/latency extensions through `clack-extensions`' host
      # halves. Without this step those tests are dead weight nothing ever runs, so it is required,
      # not `continue-on-error`.
      #
      # It must stay a named, single-feature invocation. **Never `--all-features`**: that would
      # switch the feature on for the shipped `cdylib` too, linking `clack-host` into the plugin
      # and desynchronising THIRD-PARTY-NOTICES.md from the artifact (risk R-17). The feature is
      # deliberately invisible to `xtask attribution`, which walks the default-feature resolve.
      - name: cargo test -p namir-clap --features host-ext-tests (D-18.7)
        run: cargo test -p namir-clap --features host-ext-tests

  # Covers D-18.1's "the layering lint" (D-5.2) and "the params.lock diff" (FR-PARAM-020).
  # Pure static checks over the dependency graph and a checked-in manifest -- not
  # platform-dependent, so one OS is enough.
  layering-and-params:
    name: layering + rt-logging + params.lock + attribution + identity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: xtask layering (D-5.2)
        run: cargo run -p xtask -- layering

      # M9b: FR-ERR-030's static half. `namir-app` and `namir-clap` are the two crates D-5.1 lets
      # depend on `namir-platform` *and* the two that own the audio callbacks, so they are the only
      # place a log record could be emitted from the audio thread; this rejects the logger being
      # named in any module that carries audio-thread code. Same class as the step above -- a
      # line-based scan over checked-in source, with no OS-specific behaviour to matrix over.
      - name: xtask rt-logging (FR-ERR-030)
        run: cargo run -p xtask -- rt-logging

      - name: xtask params-lock (FR-PARAM-020)
        run: cargo run -p xtask -- params-lock

      # M7: NFR-LIC-030's attribution-file freshness gate. Pure static/text check over
      # `cargo metadata`'s resolve graph, same reasoning as the two steps above for living in this
      # job rather than its own -- no OS-specific behaviour to matrix over.
      - name: xtask attribution (NFR-LIC-030)
        run: cargo run -p xtask -- attribution

      # M12: the product-identity gate. Three static checks in one subcommand -- the checked-in
      # brand-mark alpha blob against a fresh render of `images/namir.png` (integer-only, so this
      # is a byte comparison that holds on every runner), plus README.md's and TRADEMARK.md's
      # required statements. Same reasoning as the three steps above for living in this job: pure
      # static/text checks over checked-in files, with no OS-specific behaviour to matrix over.
      - name: xtask identity (NFR-DOC-040, NFR-LIC-070)
        run: cargo run -p xtask -- identity

      # M14 Phase 5: NFR-BUILD-020's *second* half. `identity` above asserts that README.md still
      # contains the build, run and test commands -- they cannot silently disappear from it. It
      # compares them against literals in `xtask/src/identity.rs` and against nothing in this file,
      # so the two were free to drift apart, and had: this job ran `xtask rt-logging`, which the
      # README's gate block did not list, and the README described a macOS `.clap` as something to
      # "assemble by hand" three milestones after `xtask bundle` started producing one.
      #
      # This step compares the two files directly, in both directions -- every command the README
      # documents is run here, and every `xtask` subcommand run here is documented there. It reads
      # this file through the same YAML subset parser M13 wrote for `release.yml`, so a workflow
      # edit that leaves the file unparseable fails here rather than on a runner.
      - name: xtask ci-commands (NFR-BUILD-020)
        run: cargo run -p xtask -- ci-commands

      # M9a: NFR-QUAL-010's traceability check, now **split into two steps with different flip
      # dates** per D-18.5 (`docs/02-architecture.md:2002-2079`). It was one `continue-on-error`
      # step from M7 until this commit, and the M7 comment it replaced was right about the coverage
      # half and silently wrong about the other one: the tool returned `plan_up_to_date &&
      # coverage_clean` as a single value, so a single `continue-on-error: true` made *both*
      # properties advisory. Deleting a `// trace:` annotation from a currently-covered Must left
      # CI green -- the regression half of NFR-QUAL-010 was enforced nowhere, the pre-commit hook
      # included. That is the hole D-18.5 exists to close, and closing it costs nothing the M7
      # reasoning was protecting.
      #
      # The two halves are genuinely independent and are ready on different dates:
      #
      #   * **Required, from today.** The generated `docs/03-test-plan.md` matches what the tool
      #     generates, and Section 14's `### M9a re-audit` denominators match the FRS (D-23.2's
      #     derived half rides here, not on the informational one). Both are mechanical and
      #     satisfiable right now: `--write` regenerates the plan, and Section 14's row set is
      #     hand-fixed. Nothing about a milestone's progress can make this red.
      #   * **Informational, until M14's Phase 6.** Zero uncovered Musts. When this was written
      #     it could not reach zero inside M9 for a reason that was not a verification gap -- ten of
      #     the then-uncovered ids belonged to milestones that had not run (M10, M12, M13), and the
      #     only route to zero was tagging unbuilt work, which D-23.1 forbids. Making it blocking
      #     then would have recreated exactly the permanently-red check M7 argued against.
      #
      #     **The milestone named above was M13 until M9b corrected it** -- D-18.5's
      #     *Consequence (added M13, 2026-08-11)* moved the flip to M9b, because M9's own share of
      #     the uncovered Musts is fourteen and this document's own §16 puts those in M9b, which it
      #     then orders *after* M13. Flipping at M13's close would have made a required check red
      #     for ten requirements no earlier milestone was asked to close.
      #
      #     **The count is now zero and the flag is still here, deliberately.** FR-UI-020 and
      #     FR-UI-070 are `Verify: M`, and since §15 item 15 a `Verify: M` Must resolves against a
      #     manual-test document *by filename*. Both documents exist and both say
      #     `Result: NOT EXECUTED`. `xtask` refuses a `trace-partial:` on a `Verify: M` Must, so
      #     there is no disposition between "no document" and "fully covered" for the tool to
      #     express -- deleting the flag today would make the required check green on evidence
      #     nobody has produced, the precise inversion of what this split is for. The flip waits on
      #     those two scripts being run by a human and their results recorded.
      #
      #     **M9b closed out on 2026-08-27 without reaching it, and the flip is now M14's**
      #     (`03-implementation-roadmap.md` §21, "What the automated half of M14 will and will not
      #     attempt"): M9b's blocker is unchanged and is not a verification gap this workflow can
      #     close -- no headless runner can execute either script (**R-16**: an Xvfb display is
      #     GLX-capable but offers no sRGB framebuffer config, and `egui-baseview` asks for one).
      #     M14's Phase 6 owns it, after a human at a screen has run the two scripts. **M14's
      #     automated half, this step included, does not flip it**, and the two sentences above
      #     naming M9b are left as the record of where it stood.
      #
      # Both steps print the identical uncovered list, each id beside the milestone the roadmap
      # makes responsible for it -- a derived label the exit status never reads. The second step
      # exists so a non-zero count is a visible annotation on the run rather than a line in a log
      # nobody opens; the first would otherwise be green while printing the same gaps.
      #
      # **The flip is the deletion of the flag and of the second step**, deliberately two edits and
      # no restructuring. Do not flip it early by deleting only the flag. It is M14 Phase 6's,
      # having been M13's and then M9b's -- and it moves with the evidence, never with a milestone
      # boundary.
      #
      # One interaction worth knowing rather than rediscovering: if the required step fails, the job
      # stops and the informational step does not run, so a stale plan temporarily hides the
      # coverage annotation. Harmless -- the required step has already printed the same list -- and
      # left alone rather than papered over with `if: always()`, which would make the flip a
      # three-line edit instead of the two D-18.5 specifies.
      - name: xtask traceability -- plan + Section 14 denominators (D-18.5, required)
        run: cargo run -p xtask -- traceability --allow-uncovered

      - name: xtask traceability -- uncovered Musts (NFR-QUAL-010, informational until M14 Phase 6)
        run: cargo run -p xtask -- traceability
        continue-on-error: true

  # Covers D-18.1's "cargo-deny licence audit" (NFR-LIC-020). deny.toml already exists at the
  # repo root; this job just runs it in CI instead of by hand.
  license-audit:
    name: cargo-deny license audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses

      # M11: `deny.toml`'s `[sources]` policy -- `unknown-git = "deny"` plus a narrow, named
      # `allow-git` -- was enforced by nothing in CI until this step. `license-audit` ran `check
      # licenses` and `network-free` ran `check bans`; `check sources` ran only when somebody
      # typed the full `cargo deny check` locally, which AGENTS.md's command list assumes but no
      # gate required. That gap did not matter while every dependency came from crates.io. D-13.4
      # ends that: the `cpal` fork is the tree's first non-registry source, the allowance naming it
      # is what keeps this gate green, and without this step a *second*, unreviewed git source
      # could be added and CI would not notice. Its own risk row is R-10.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check sources

  # M7: D-18.2/FR-ERR-070.5's network-free build gate, deferred here by design since M1 (see this
  # file's own header comment above) until there was a whole product to check against. FR-ERR-070's
  # own *Verify* method is S -- "a build-time check that no network-capable dependency is linked
  # into the 1.0 binaries." Reuses the `cargo-deny` wiring `license-audit` already established
  # rather than a bespoke tool: deny.toml's `[bans] deny` list now names the well-known HTTP/TLS/
  # DNS/async-networking crates that would most plausibly arrive as an unnoticed transitive
  # dependency; this job fails the moment any of them enter Cargo.lock. A separate job from
  # `license-audit` because it gates a distinct requirement (NFR-LIC-020 vs. FR-ERR-070.5), not a
  # licensing concern.
  network-free:
    name: cargo-deny network-free build (D-18.2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check bans

  # M9a: FR-CLAP-020's own words are "shall pass the reference CLAP validator with no errors, **as a
  # gate in CI**" -- so the artifact under test is this configuration, not a hand-written Rust test.
  # That is limb 1 of FRS Section 10's M9 adequacy rule ("tag the configuration when the
  # configuration is the artifact under test; tag a test when the product is",
  # `docs/01-functional-requirements.md:1223-1227`), and FR-CLAP-020's `*Verify:*` line is a bare
  # `S.` electing nothing, so this job carries the requirement's `# trace:` directly and needs no
  # test behind it. Until now the row's entire evidence was M6's single manual 32/32 run
  # (`docs/03-implementation-roadmap.md:1701-1703`); a one-time run is not a gate.
  #
  # ---- Supply-chain shape (closes `docs/03-implementation-roadmap.md` Section 15 item 11, "due at
  # M9a, before the gate lands"). Recorded here rather than in `02-architecture.md` Section 17,
  # under that register's own titled note (`02-architecture.md:1836-1847`): the register exists for
  # NFR-LIC-020/030 and tracks what is *linked into the shipped binary*; a tool that runs on a CI
  # machine and puts nothing of its own into the artifact would blur exactly that distinction. That
  # note already names `clap-validator` as covered by the reasoning, and says its "availability,
  # versions and licences are D-18.3's and the CI configuration's business, recorded there" --
  # this comment is that record.
  #
  #   * Not published on crates.io (S-4's finding, `02-architecture.md:2474-2475`), so this is an
  #     install from git: the first non-registry build input in this workflow. `deny.toml`'s
  #     `[sources]` policy governs cargo *dependencies* and cannot see a CI-installed tool at all,
  #     so nothing that already exists catches this -- the pin below is the whole mitigation.
  #     Same class of exposure as D-13.4's forked `cpal`, tracked by R-10.
  #   * Pinned by **commit**, which is item 11's first option, taken over the other two. Vendoring a
  #     built binary was rejected: upstream's prebuilt artifacts come from a third-party redirector
  #     over expiring Actions artifacts, and committing an opaque executable into a repository whose
  #     every test fixture is generated by decision (D-19.1) is a worse provenance story than a
  #     hash, not a better one. A floating install was rejected because it makes this gate's meaning
  #     change without any commit here -- the failure mode being a red build nobody caused, or a
  #     quietly weakened validator, neither of which a reviewer can see in a diff.
  #   * `--locked` is load-bearing, not hygiene: upstream commits its own `Cargo.lock`, so the flag
  #     pins the validator's entire transitive tree to what upstream resolved, not to whatever
  #     resolves on the day this job runs.
  #   * Version/licence/toolchain, read from the pinned checkout on 2026-08-08 rather than inherited:
  #     `clap-validator` 0.4.1, `license = "MIT"` with a LICENSE file present, `rust-version =
  #     "1.95.0"` (under this workspace's own 1.97 pin, so `@stable` satisfies both), commit dated
  #     2026-07-24 -- the same date Section 19 records for the S-4 spike's copy.
  #   * Deliberately **not** cached. The install is a from-source build on every run; that is the
  #     price of the pin being the only trusted input, and `Swatinem/rust-cache` explicitly does not
  #     manage `~/.cargo/bin`, so a hand-rolled binary cache here would be a second, unpinned
  #     artifact to reason about.
  #
  # ---- Runner scope: **Windows only**, and each exclusion is a reason rather than a default.
  #   * **macOS is deferred, and the reason changed under this comment.** A `.clap` on macOS is a
  #     *bundle directory*, not a renamed dylib -- CLAP's own `entry.h` definition, recorded at
  #     D-13.3's M8-planning Consequence (`02-architecture.md:1305-1316`). This said the exclusion
  #     was "structurally impossible today" because `xtask bundle`, the only thing that produces
  #     such a bundle, "is D-18.3/M13 work that does not exist yet". **M13 built it** (M9b corrected
  #     this comment). What remains is a cost question rather than an impossibility: this job would
  #     have to run `xtask bundle --target macos` first to have an artifact to hand the validator,
  #     on a second runner, for a plugin whose editor is Win32-only anyway (see the Linux bullet
  #     below, which applies to macOS identically). Left deferred deliberately, not overlooked.
  #   * **Linux is deferred for a product reason, not a runner one.** `crates/namir-clap/src/gui.rs`
  #     restricts `is_api_supported`/`get_preferred_api` to `GuiApiType::WIN32` with **no `cfg`**
  #     (`gui.rs:91-105`), so on a Linux runner this plugin declares the `gui` extension while
  #     supporting no API there. Every executed validator run in this project's history is Windows
  #     (S-4 2026-08-04, M6's 32/32, and M9a's own run below), so adding Linux here would gate a
  #     merge on a surface nobody has ever exercised -- the "red on arrival" failure D-18.5's own
  #     mechanism paragraph warns about. It is worth adding once someone has run it by hand, and the
  #     GUI-portability question behind it is Section 15's live scope item, not this job's to settle.
  #   * FR-CLAP-020 does **not** quantify over platforms -- one sentence, `Verify: S`, no "each" and
  #     no enumerated list -- so under D-23.1's first question a single-runner gate spans the whole
  #     requirement and the plain `# trace:` above is honest. Windows is also AGENTS.md's primary
  #     platform.
  #   * **S-4's MSVC `linker_messages` finding does not bite this job**, stated because it is the
  #     obvious reason to think Windows was the wrong choice here. That finding (see `build-test`'s
  #     clippy step above) is about a bare `-D warnings` gate failing on the linker's stdout chatter
  #     during a `cdylib` link. This job builds with plain `cargo build` and no `-D warnings`, so
  #     the warning, if it appears, is printed and ignored. It constrains the clippy step, not this
  #     one.
  #
  # This job is blocking, with no `continue-on-error`. "As a gate in CI" is the requirement's own
  # text, and an informational validator step would not be one.
  #
  # trace: FR-CLAP-020
  clap-validator:
    name: clap-validator (FR-CLAP-020)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Installed after `rust-cache` so the binary is not in `~/.cargo/bin` while that action takes
      # its inventory. Re-running with an unchanged rev is cheap by cargo's own bookkeeping: it
      # records the source in `.crates.toml` and skips an identical install.
      - name: Install clap-validator (pinned; see this job's supply-chain comment)
        run: >
          cargo install --locked
          --git https://github.com/free-audio/clap-validator
          --rev b2f1d9b79b1d264a5747f46707d72b1aa40a02ef
          clap-validator

      - name: Build the plugin (cdylib)
        run: cargo build --release -p namir-clap --lib

      # The validator takes a path to a `.clap`, and on Windows a `.clap` *is* the built shared
      # library under that name (D-13.3's Consequence, `02-architecture.md:1305-1307`) -- so the
      # rename is the whole of "put it where the validator finds it", and it is the same artifact
      # D-18.3's packaging job will place at D-13.3's install paths. Staged into its own directory
      # rather than renamed in `target/release/` so nothing downstream trips over a file cargo did
      # not put there.
      - name: Stage the built cdylib as Namir.clap
        # `pwsh` is already the default `run` shell on a Windows runner; named explicitly so this
        # step does not silently become `bash` if that default is ever changed workflow-wide.
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path staging | Out-Null
          Copy-Item target/release/namir_clap.dll staging/Namir.clap -Force

      # Out-of-process (the validator's default) rather than `--in-process`: a plugin crash is then
      # reported as a failed test instead of taking the validator down with it. Full output is kept
      # rather than `--only-failed`, since the run log is this requirement's evidence and a passing
      # run that prints nothing evidences nothing. Exits non-zero iff any test failed, which is what
      # makes this a gate (upstream `src/commands/validate.rs:83-87`).
      - name: clap-validator validate
        run: clap-validator validate staging/Namir.clap

  # ---------------------------------------------------------------------------------------------
  # M14 Phase 5 -- the distribution lane. **`xtask bundle` had never run outside a `v*` tag.**
  # Everything that asserts a real produced tree lived in `release.yml`, so a packaging regression
  # was discoverable only at the moment it is most expensive: cutting a release. This job runs the
  # same commands on every push and pull request, on all three platforms, and then **opens what it
  # produced** rather than the tree that went in.
  #
  # The distinction is the whole point of the lane and is worth stating rather than assuming.
  # `xtask bundle` produces a *staging tree*; `release.yml` archives and hashes it. A check that
  # reads the staging tree cannot catch a packaging step that drops a file -- only unpacking the
  # artifact a user would download can. So each platform below builds its archive with the same
  # commands `release.yml` uses, **deletes the intermediate copy**, unpacks the archive into a fresh
  # directory and points `xtask bundle --inspect` at *that*. The check it runs is the same
  # `bundle::check` the packaging step runs, so an archive that lost `LICENSE-APACHE`, or whose
  # `Namir.clap` stopped being a bundle directory on macOS, fails here by name.
  #
  # ---- What this lane does **not** do, so nothing above is read as more than it is.
  #   * **The Windows installer is not built or opened here.** Inno Setup would build it (`iscc` is
  #     preinstalled), but the payload `namir.iss` reads is the staging tree this job already
  #     inspects, and opening the produced `.exe` needs `innoextract` -- a second pinned
  #     Chocolatey input on the merge path, for a container whose contents this lane has already
  #     asserted twice. `release.yml` remains the only place it is built.
  #   * **Nothing is exercised.** Not the standalone (no runner has an audio device or a display,
  #     §22 R-16 -- FR-CFG-030's own *Consequence (added M14)* accepts that clause as
  #     unautomatable), and not the plugin: `clap-validator` runs in its own job above, against a
  #     staged `cdylib` on Windows, for the product reason that job's comment gives.
  #   * **The version string is a CI placeholder** (`0.0.0-ci` on macOS, which is the only platform
  #     whose packaging takes one). A tagged release names the tag; nothing here is publishable and
  #     nothing here is uploaded.
  #
  # ---- Cost. A release build of the workspace on three runners. `Swatinem/rust-cache` is on, as
  # in `build-test` -- unlike `release.yml`, which deliberately runs uncached because a *published*
  # artifact should be a function of the source tree and the toolchain alone. Nothing this job
  # produces is published, so the cache is free here and the argument against it does not apply.
  #
  # trace-partial: FR-PKG-040
  # uncovered: FR-PKG-040 — this lane opens the plain archive of every platform (the ZIP, the
  # uncovered: tarball, and on macOS the .pkg, .dmg and .zip through make_installer.sh's own
  # uncovered: verify_outputs) but not the **Windows installer**: `namir.iss` reads the staging
  # uncovered: tree, `release.yml` builds the .exe only on a v* tag, and nothing anywhere unpacks
  # uncovered: the produced installer to assert the three files inside it; closes M8
  bundle-and-inspect:
    name: bundle + inspect the produced distribution (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # See `build-test`'s identical step: `namir-app` takes `cpal`, whose ALSA backend needs real
      # development headers at build time, and this job builds the whole workspace in release.
      - name: Install ALSA development headers (Linux only, for cpal's alsa-sys)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # D-18.3's fixed order, first two steps: build, then bundle. `xtask bundle` copies artifacts
      # a release build has already produced and builds nothing itself, so a debug build here would
      # stage nothing.
      - name: cargo build --release --workspace
        run: cargo build --release --workspace

      # No `--target`: `Platform::host()` resolves it from the runner, which is exactly what the
      # README documents a developer running, and what `xtask ci-commands` checks this file against.
      # A materialising run asserts its own output before returning (FR-PKG-020's method), so this
      # step is already the staging-tree half of the check.
      #
      # trace-partial: NFR-LIC-030
      # uncovered: NFR-LIC-030 — the "shipped with the binaries" clause is now asserted on all
      # uncovered: three platforms on every push and pull request, from the *produced* archive
      # uncovered: rather than the staging tree — but the Windows installer's payload is still
      # uncovered: opened by nothing, and no check anywhere reads the attribution file's *contents*
      # uncovered: after packaging: `bundle::check` asserts the three documents are present, not
      # uncovered: that the notices file inside an archive is the current one; closes M8
      - name: xtask bundle (stage this runner's platform, and assert what it staged)
        run: cargo run -p xtask -- bundle

      # Windows: FR-PKG-050's plain ZIP, built with `release.yml`'s own `Compress-Archive` block
      # (which takes its wording from `packaging/windows/README.md`). The staging copy is removed
      # before the archive is expanded, so what `--inspect` reads can only have come out of the
      # ZIP's bytes.
      - name: Build the plain ZIP and open it again (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $Name  = "namir-ci-windows-x86_64"
          $Stage = "target\dist\$Name"
          Remove-Item -Recurse -Force target\dist -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path target\dist | Out-Null
          Copy-Item -Recurse "target\bundle\windows" $Stage
          Compress-Archive -Path $Stage -DestinationPath "target\dist\$Name.zip" -Force
          Remove-Item -Recurse -Force $Stage
          Expand-Archive -Path "target\dist\$Name.zip" -DestinationPath "target\dist\unpacked" -Force
          cargo run -p xtask -- bundle --inspect "target\dist\unpacked\$Name"

      # Linux: the deterministic tarball, verbatim from `release.yml`, which took it from
      # `packaging/linux/README.md`. `SOURCE_DATE_EPOCH` is fixed rather than read from the commit
      # -- this archive is never published, and a constant keeps the step reproducible on a rerun.
      - name: Build the tarball and open it again (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          set -euo pipefail
          PKG="namir-ci-linux-$(uname -m)"
          rm -rf target/package
          mkdir -p "target/package/${PKG}"
          cp -R target/bundle/linux/. "target/package/${PKG}/"
          cp packaging/linux/install.sh "target/package/${PKG}/install.sh"
          cp packaging/linux/README.md  "target/package/${PKG}/INSTALL.md"
          chmod 755 "target/package/${PKG}/install.sh" \
                    "target/package/${PKG}/namir" \
                    "target/package/${PKG}/Namir.clap"
          tar --create \
              --directory target/package \
              --format=gnu \
              --sort=name \
              --owner=0 --group=0 --numeric-owner \
              --mtime="@0" \
              --file - "${PKG}" \
            | gzip -9 -n > "target/package/${PKG}.tar.gz"
          rm -rf "target/package/${PKG}"
          mkdir -p target/package/unpacked
          tar -xzf "target/package/${PKG}.tar.gz" -C target/package/unpacked
          cargo run -p xtask -- bundle --inspect "target/package/unpacked/${PKG}"

      # Linux, second half: the tarball's own `install.sh` runs against a throwaway prefix and a
      # throwaway CLAP directory -- a clean environment in the only sense a runner can offer one --
      # and the three FR-PKG-040 documents are asserted at the paths the script's `--help` promises.
      # This is the first time any installer in this repository has been executed anywhere.
      #
      # trace-partial: FR-CFG-030
      # uncovered: FR-CFG-030 — the method's four clauses are two products x (installed alone in a
      # uncovered: clean environment, exercised there). Only Linux installs at all, `install.sh`
      # uncovered: places **both** products in one run so neither is installed *alone*, no Windows
      # uncovered: or macOS installer is executed by any job, and nothing is exercised afterwards:
      # uncovered: the standalone's exercising clause is the FRS's accepted limitation (no runner
      # uncovered: has an audio device), the plugin's is not accepted and stays open; closes M8
      - name: Install the unpacked tarball into a throwaway prefix (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          set -euo pipefail
          PKG="namir-ci-linux-$(uname -m)"
          ROOT="${PWD}/target/package/install-root"
          rm -rf "$ROOT"
          sh "target/package/unpacked/${PKG}/install.sh" \
            --prefix "${ROOT}/prefix" --clap-dir "${ROOT}/clap"
          test -f "${ROOT}/clap/Namir.clap"
          test -x "${ROOT}/prefix/bin/namir"
          for document in THIRD-PARTY-NOTICES.md LICENSE-MIT LICENSE-APACHE; do
            test -f "${ROOT}/prefix/share/doc/namir/${document}" \
              || { echo "::error::${document} is not at the installed documents path"; exit 1; }
          done

      # macOS: `packaging/macos/make_installer.sh`, the same invocation `release.yml` makes, minus
      # the signing secrets it does not have (every signing variable is optional by that script's
      # design; unset means the unsigned path, which is today's state on a tag too). It builds the
      # `.pkg`, the `.dmg` and FR-PKG-050's `.zip`, and its own `verify_outputs` expands the `.pkg`,
      # mounts the `.dmg` and extracts the `.zip` to assert the three documents inside each.
      #
      # **No line of that script had ever been executed anywhere when this step was written** --
      # its own header says so. This lane is where it stops being true, and the first run finding
      # something is the lane working: the alternative is finding it while cutting a release.
      - name: Package with make_installer.sh, which opens what it produced (macOS)
        if: matrix.os == 'macos-latest'
        run: bash packaging/macos/make_installer.sh --version 0.0.0-ci

      # The same `.zip`, re-opened by `xtask` rather than by the packaging script. Not redundant:
      # `make_installer.sh` cannot be FR-PKG-040's traced artifact -- `xtask traceability` does not
      # scan `packaging/**`, as that function's own note to whoever closes the requirement says --
      # and `bundle::check` asserts more than the script's presence loop does, re-deriving the whole
      # macOS layout including both `Info.plist` files byte for byte.
      - name: xtask bundle --inspect (what came out of the .zip, macOS)
        if: matrix.os == 'macos-latest'
        run: |
          set -euo pipefail
          rm -rf target/packaging/macos/unpacked
          ditto -x -k target/packaging/macos/Namir-0.0.0-ci-macos.zip target/packaging/macos/unpacked
          cargo run -p xtask -- bundle --inspect target/packaging/macos/unpacked/Namir-0.0.0-ci

  # Covers D-18.1's "an MSRV pin ... enforced" (NFR-PORT-010). The pinned version is read out of
  # root Cargo.toml's [workspace.package].rust-version at run time rather than hardcoded here, so
  # this job can't silently drift out of sync the way a copy-pasted version string could (the
  # exact failure mode §4 of the roadmap warns about for gate configuration in general).
  #
  # trace: NFR-PORT-010
  msrv:
    name: MSRV check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # See `build-test`'s identical step for why this is needed as of M6 (`namir-app`'s `cpal`
      # dependency, ALSA backend).
      - name: Install ALSA development headers (for cpal's alsa-sys)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Read rust-version from root Cargo.toml
        id: msrv
        run: |
          version=$(grep -m1 '^rust-version' Cargo.toml | sed -E 's/.*"([0-9.]+)".*/\1/')
          if [ -z "$version" ]; then
            echo "::error::could not extract rust-version from Cargo.toml"
            exit 1
          fi
          echo "pinned MSRV: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - uses: Swatinem/rust-cache@v2

      - name: cargo check --workspace --all-targets (on the MSRV toolchain)
        run: cargo check --workspace --all-targets

  # Covers D-18.1's "a build in a container with no C++ compiler present" (NFR-PORT-040's
  # verification clause). NFR-PORT-040 says Namir "shall not require a C++ toolchain" -- that
  # means no C++ *compiler* (g++/clang++) specifically, not no C compiler at all: rustc's default
  # Linux linker driver is `cc` (a C compiler, gcc), which every build needs regardless of
  # language and which this job deliberately leaves in place. Only g++/clang++ are removed, then
  # asserted absent rather than just hoped absent.
  #
  # trace: NFR-PORT-040
  no-cxx-toolchain:
    name: build with no C++ compiler (NFR-PORT-040)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # See `build-test`'s identical step for why this is needed as of M6. Installed *before* the
      # g++/clang++ removal below on the theory that apt itself should run against an ordinary,
      # unmodified toolchain rather than one this job has already started deleting pieces of.
      - name: Install ALSA development headers (for cpal's alsa-sys)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Remove g++/clang++ (leave gcc/cc in place)
        # `apt-get remove` pulls in a full system dependency resolution, which on the current
        # ubuntu-latest image trips over an unrelated apt bug: several `libopencl-clang-<N>-dev` /
        # `python3-clang-<N>` packages preinstalled on the runner conflict with the virtual
        # `libopencl-clang-x.y-dev` / `python-clang-x.y` packages, so apt refuses the whole
        # transaction ("you have held broken packages") -- nothing to do with g++/clang++
        # specifically, or with this repo. Since this job only needs the compilers off PATH, not
        # actually uninstalled, deleting the binaries directly sidesteps apt's resolver.
        run: sudo rm -f /usr/bin/g++ /usr/bin/g++-* /usr/bin/clang++ /usr/bin/clang++-* /usr/local/bin/g++ /usr/local/bin/g++-* /usr/local/bin/clang++ /usr/local/bin/clang++-*

      - name: Assert no C++ compiler remains
        run: |
          if command -v g++ >/dev/null 2>&1 || command -v clang++ >/dev/null 2>&1; then
            echo "::error::a C++ compiler is still on PATH after removal"
            exit 1
          fi
          echo "confirmed: no g++/clang++ on PATH (cc/gcc left in place)"

      - name: cargo build --workspace --all-targets
        # Checked by hand against every dependency in the current tree (namir-core/dsp/nam/ir/
        # engine/fixtures/params/platform + blake3, serde, serde_json, rand, rand_pcg, realfft,
        # rustfft, assert_no_alloc, hound, rubato): none of them need g++/clang++ specifically --
        # hound and rubato (both added at M2) carry no build script (`cargo metadata` confirms
        # hound has none; rubato's own Cargo.toml sets `build = false`), so this claim extends
        # cleanly to them. One caveat worth
        # flagging rather than discovering silently if this job ever goes red: blake3's optional
        # accelerated backends *do* shell out to a C compiler via the `cc` crate on some targets
        # (confirmed locally while building this workflow -- see mobile-cross-build below, where
        # it actually bites on aarch64). That's still a C compiler, not C++, so it does not trip
        # this job's specific gate on this job's native x86_64 target, but it is the kind of
        # thing this comment exists to flag rather than let be a surprise.
        #
        # M5 note: this audit still holds. namir-state adds exactly one new normal dependency,
        # `base64` -- checked against this workspace's adoption bar and confirmed to carry no
        # build script at all (see namir-state's own Cargo.toml comment on the crate), so it
        # cannot need a C++ compiler to begin with. namir-library adds none of its own beyond
        # serde/serde_json, already covered above. Both new crates are ordinary `--workspace`
        # members, so this job's existing invocation already covers them -- no change needed
        # beyond this note.
        #
        # M6 note: namir-platform's full scope (`thread_priority.rs`) adds `libc`, scoped in its
        # Cargo.toml to `cfg(any(target_os = "linux", target_os = "macos"))` only -- absent on
        # this job's Windows/native-x86_64-Linux build only in the sense that it's a real
        # dependency edge on this job's own OS (ubuntu-latest is `target_os = "linux"`). Checked:
        # `cargo tree -p namir-platform --target x86_64-unknown-linux-gnu -e normal,build` shows
        # `libc` carries no `[build-dependencies]` of its own -- unlike blake3 above, its build
        # script (which exists, and is exactly what counted against it at D-12.3, see
        # `namir-platform/Cargo.toml`'s own comment) only probes the rustc/target version to set
        # `--cfg` flags; it does not shell out to `cc` and so cannot need a C++ compiler either.
        # No Windows-side dependency was added -- `thread_priority.rs`'s Windows implementation is
        # three hand-rolled `extern` declarations against `kernel32.dll`, already always present.
        #
        # M6 note (`namir-app`): `cpal`'s Linux backend (`alsa-sys`) needs `libasound2-dev`, added
        # as this job's own step above -- but its `build.rs` only calls `pkg-config` to link
        # against the already-compiled system `libasound.so`; it does not shell out to `cc`/`c++`
        # to compile anything itself (checked against `alsa-sys-0.4.0`'s own `build.rs`), so it
        # cannot need a C++ compiler either. `rtrb` (`namir-app`'s own bridge ring) and
        # `serde`/`serde_json` (`namir-app`'s settings persistence) are already covered above.
        run: cargo build --workspace --all-targets

  # Covers D-18.1's "cross-build of the mobile-capable crates for aarch64-linux-android and
  # aarch64-apple-ios" (NFR-PORT-030's verification clause), scoped to D-5.1's "builds for
  # mobile: yes" crates that exist as of M2: namir-core, namir-params, namir-dsp, namir-nam,
  # namir-ir, namir-engine, namir-platform, and namir-worker as of M4, namir-state and
  # namir-library as of M5 (namir-fixtures is dev/test tooling, not in D-5.1's table, so it's
  # excluded). This list grows incrementally as M6 lands namir-ui -- update the `-p` list in both
  # jobs below (and check it against D-5.1's actual table) each time a new crate is marked "builds
  # for mobile: yes", per the roadmap's own framing of this gate as incremental, not built once.
  #
  # namir-worker was added at M4, not M6 as an earlier revision of this comment predicted. Nothing
  # in it blocks a mobile build: std::thread/std::sync/std::fs, available_parallelism and `rtrb`
  # (pure Rust, no_std-capable, zero dependencies) are all available on both targets.
  #
  # namir-state and namir-library were added at M5, exactly as this comment predicted. Neither
  # blocks a mobile build either: namir-state's only new dependency (`base64`, `default-features =
  # false, features = ["alloc"]`) is no_std-capable and carries no build script; namir-library adds
  # no third-party dependency of its own beyond serde/serde_json, both already proven mobile-safe
  # by every crate above it in this list.
  #
  # namir-platform reached D-13.2/D-13.3's full scope at M6 (this list's own entry for it already
  # existed since M2, when it carried only D-7.4's DenormalGuard). Its one new dependency, `libc`
  # (`thread_priority.rs`'s Linux/macOS pthread bindings), is `cfg`-scoped in its Cargo.toml to
  # exactly `target_os = "linux"` / `target_os = "macos"` -- neither matches `aarch64-linux-android`
  # or `aarch64-apple-ios`, so it is absent from this crate's dependency tree on both mobile
  # targets entirely (confirmed: `cargo tree -p namir-platform --target aarch64-linux-android -e
  # normal,build` and the `aarch64-apple-ios` equivalent both show no `libc` node at all, unlike
  # the native-Linux tree this job's sibling job builds against). `thread_priority.rs`'s Windows
  # implementation is hand-rolled `extern` declarations, not a dependency, so it adds nothing to
  # either mobile target either. `paths.rs`/`clap_paths.rs` (D-13.2's config/log paths, D-13.3's
  # CLAP install paths) use only `std::env`/`std::path` and add no dependency at all.
  #
  # M7: checked, deliberately NOT adding namir-ui here despite D-5.1's original table having
  # predicted it would land in this list once M6 built it. It doesn't build for mobile: it depends
  # directly on `baseview` 0.2 (crates/namir-ui/Cargo.toml), whose platform.rs only compiles a
  # backend under target_os "macos"/"linux"/"windows" -- neither "android" nor "ios" matches, so
  # the module is empty and anything using baseview::Window fails to compile on either mobile
  # target. Verified this session via `cargo check --target aarch64-linux-android -p namir-ui`
  # (this machine has the NDK and both mobile rustup targets installed, unlike M6's authoring
  # machine); it got through baseview's own compilation before failing on the already-documented
  # blake3/NEON-needs-a-C-cross-compiler gap below, and platform.rs's cfg gating is a plain
  # source-level fact regardless. See docs/02-architecture.md D-5.1's "Consequence (added M7)"
  # note, which also corrects that table's "Builds for mobile?" cell for namir-ui from Yes to No.
  #
  # These are library-only builds (no bins), so in principle they don't need a working final
  # linker for the target platform -- an rlib build has no link step. That reasoning holds for
  # the *link* step. It does NOT extend to every build-script compile step upstream of it: see
  # the Android job's own comment below for a real counter-example found while writing this file.
  #
  # trace: NFR-PORT-030
  mobile-cross-build-android:
    name: mobile cross-build (aarch64-linux-android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2

      - name: Point cc-rs at the preinstalled Android NDK
        # Verified locally while writing this workflow (this machine has no NDK installed): a
        # plain `cargo build --target aarch64-linux-android -p namir-core` fails, because blake3
        # (a namir-core dependency, pulled in transitively by every crate below) auto-enables its
        # NEON-accelerated backend on aarch64 targets and compiles a small C source file for it
        # via the `cc` crate -- which needs an actual C cross-compiler for the target and errors
        # with "failed to find tool aarch64-linux-android-clang" when none is configured. This
        # contradicts the "no linker needed for an rlib build" assumption above at the build-script
        # level specifically, not the final-link level.
        #
        # GitHub-hosted ubuntu-latest runners ship a full Android SDK + NDK preinstalled
        # (actions/runner-images), with ANDROID_NDK_HOME/ANDROID_NDK_LATEST_HOME pointing at it,
        # so the fix is to point cc-rs's CC_<target> override at that existing toolchain rather
        # than install anything new. NOT verified against the real GitHub-hosted runner image
        # (no CI execution available while authoring this) -- verified only that this is the
        # failure being worked around, and that CC_aarch64_linux_android is the exact env var
        # cc-rs checks (visible in the local failure's own diagnostic output).
        run: |
          NDK_ROOT="${ANDROID_NDK_HOME:-$ANDROID_NDK_LATEST_HOME}"
          if [ -z "$NDK_ROOT" ]; then
            echo "::error::no Android NDK found via ANDROID_NDK_HOME/ANDROID_NDK_LATEST_HOME"
            exit 1
          fi
          TOOLCHAIN_BIN="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "CC_aarch64_linux_android=$TOOLCHAIN_BIN/aarch64-linux-android21-clang" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$TOOLCHAIN_BIN/llvm-ar" >> "$GITHUB_ENV"

      - name: cargo build --target aarch64-linux-android (library crates only)
        run: >
          cargo build --target aarch64-linux-android
          -p namir-core -p namir-params -p namir-dsp -p namir-nam -p namir-ir -p namir-engine -p namir-state -p namir-library -p namir-platform -p namir-worker

  mobile-cross-build-ios:
    name: mobile cross-build (aarch64-apple-ios)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - uses: Swatinem/rust-cache@v2

      - name: cargo build --target aarch64-apple-ios (library crates only)
        # Unlike the Android job, this needs no extra env wiring: macos-latest ships Xcode, and
        # Xcode's `clang` cross-compiles to iOS out of the box via `xcrun` without a separate NDK
        # -- so blake3's NEON C backend (see the Android job's comment) finds a working C
        # compiler for aarch64-apple-ios with no extra setup. Not verified locally the way the
        # Android finding was: this authoring machine is Windows and cannot run Xcode/xcrun at
        # all, so this is inference from Apple's documented toolchain behaviour, not a local
        # repro. Flagging the asymmetry rather than implying both jobs were equally checked.
        run: >
          cargo build --target aarch64-apple-ios
          -p namir-core -p namir-params -p namir-dsp -p namir-nam -p namir-ir -p namir-engine -p namir-state -p namir-library -p namir-platform -p namir-worker

  # Covers docs/03-implementation-roadmap.md §5's "a cargo-llvm-cov coverage report generated on
  # every push, informational only, no blocking threshold". Deliberately no pass/fail condition
  # on the coverage number anywhere in this job -- §4 of the roadmap: "it does not block a
  # milestone or a merge", because this project's actual quality bar is NFR-QUAL-010's
  # per-requirement traceability, not a line-coverage percentage. Do not "fix" this job by adding
  # a threshold; that would contradict a deliberate decision, not correct an oversight.
  coverage:
    name: coverage (informational)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # See `build-test`'s identical step for why this is needed as of M6.
      - name: Install ALSA development headers (for cpal's alsa-sys)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools

      - uses: taiki-e/install-action@cargo-llvm-cov

      - uses: Swatinem/rust-cache@v2

      - name: cargo llvm-cov --workspace
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info

      - uses: actions/upload-artifact@v4
        with:
          name: lcov.info
          path: lcov.info

  # Covers docs/03-implementation-roadmap.md §7 (M3)'s exit-criterion benchmark
  # (`namir-engine/benches/six_stage_chain.rs`): the real assembled six-stage chain, gate + EQ
  # active, at NFR-PERF-010's exact literal condition (48 kHz, 64-sample block, standard WaveNet,
  # 2 s stereo IR). Deliberately just that one condition, not D-2.1/D-2.2's full block-size/rate
  # grid (that grid is R-8's `namir-ir` sweep's job, already covered by that crate's own
  # `examples/perf_sweep.rs`, not this job) -- keeps this job's runtime bounded (~100,000 measured
  # blocks) rather than a multi-point grid on every push.
  #
  # Informational only, same reasoning as the `coverage` job above: this workflow runs on
  # GitHub-hosted shared runners, not `docs/02-architecture.md` §2's pinned reference machine
  # (AMD Ryzen 9 5950X, Windows 11) -- exactly the reasoning D-2.1 itself gives for pinning a
  # single reference machine in the first place ("using CI runner hardware as the baseline [is]
  # too variable to regress against"). A shared, variable-hardware CI runner can never certify
  # NFR-PERF-010's percentage; it can only build the benchmark, run it, and preserve the numbers
  # for a human to look at. Final NFR-PERF-010 sign-off against the literal pinned reference
  # machine remains a manual pre-1.0 step -- do not "fix" this job by removing the environment
  # variable below; that would fail the build on runner hardware this project has explicitly
  # decided not to regress against.
  #
  # Since M9b the benchmark itself **asserts** the 25% budget by default (twice: on a
  # contamination-immune per-residue-minimum estimator unconditionally, and on raw p99.9 over every
  # repetition D-2.4 permits quoting) -- the `Verify: B` the FRS asks for, which the binary
  # previously only printed. NAMIR_PERF_010_INFORMATIONAL turns both assertions into an explicit,
  # printed skip, which is correct *here specifically*: the budget is 25% of one core **of the
  # reference machine**, so on a slower shared runner an absolute 25% assertion is not a weaker
  # measurement but a meaningless one. The consequence is booked honestly rather than glossed --
  # the "as a CI regression gate" half of NFR-PERF-010's `Verify:` remains unspanned, and the
  # `// trace-partial:` above that benchmark's `main` says exactly that. Closing it needs a
  # self-hosted runner on the §2 machine, not a threshold on this one.
  nfr-perf-010-chain-bench:
    name: NFR-PERF-010 chain benchmark (informational)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: cargo bench -p namir-engine --bench six_stage_chain
        env:
          NAMIR_PERF_010_INFORMATIONAL: "1"
        run: cargo bench -p namir-engine --bench six_stage_chain | tee six-stage-chain-bench.txt

      - uses: actions/upload-artifact@v4
        with:
          name: six-stage-chain-bench.txt
          path: six-stage-chain-bench.txt

  # Covers `namir-app/benches/startup_to_audible.rs` (NFR-PERF-030, M13's §20 scope note): the
  # standalone application's start-up to an audible state, measured by launching the real `namir`
  # binary under `namir_app::startup_probe`'s seam.
  #
  # **This job can never certify NFR-PERF-030, and is not trying to.** A GitHub-hosted runner has no
  # audio device, so `namir-app` diverts to `open_window_without_audio` and never becomes audible --
  # which is precisely why §20's scope note moved this requirement out of M9 in the first place. The
  # benchmark's default behaviour on such a machine is to *fail*, deliberately (a `Verify: B`
  # artifact whose threshold quietly evaporates is the failure mode NFR-PERF-010's own bench is on
  # record for), so this job sets NAMIR_STARTUP_ALLOW_NOT_AUDIBLE to turn that into an explicit,
  # printed skip. Expect the uploaded output to say SKIPPED -- NOT MEASURED, NOTHING ASSERTED.
  #
  # What it therefore buys, stated plainly so nobody mistakes it for coverage: the not-audible
  # branch of the seam is exercised end-to-end on every push -- a real `namir` process, spawned,
  # reaching a decision and exiting rather than opening a window and hanging -- on the one machine
  # class that can exercise it. The audible branch, and the 3 s ceiling itself, are a
  # reference-machine matter (D-2.4, `docs/02-architecture.md` section 2) and stay one. Do not
  # "fix" this job by removing the allow flag; that would fail the build on hardware this project
  # has explicitly decided not to measure against.
  nfr-perf-030-startup-bench:
    name: NFR-PERF-030 start-up benchmark (informational, cannot certify)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install ALSA development headers (for cpal's alsa-sys)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - uses: Swatinem/rust-cache@v2

      - name: cargo bench -p namir-app --bench startup_to_audible
        env:
          NAMIR_STARTUP_ALLOW_NOT_AUDIBLE: "1"
        run: cargo bench -p namir-app --bench startup_to_audible | tee startup-to-audible-bench.txt

      - uses: actions/upload-artifact@v4
        with:
          name: startup-to-audible-bench.txt
          path: startup-to-audible-bench.txt
