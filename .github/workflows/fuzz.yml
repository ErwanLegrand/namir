# Covers docs/02-architecture.md D-18.1's "the fuzz targets". Split out from ci.yml because this
# is the only gate in D-18.1's list that needs a nightly toolchain (cargo-fuzz's libFuzzer
# integration requires nightly's unstable sanitizer-coverage flags) -- keeping the stable-toolchain
# matrix in ci.yml free of that requirement is simpler to reason about than threading a
# per-job toolchain override through a single file.
#
# `crates/namir-nam/fuzz`, `crates/namir-state/fuzz` and `crates/namir-ir/fuzz` are each their own
# cargo-fuzz project with their own empty [workspace] table (see either Cargo.toml's own comment)
# and are excluded from the root workspace, so each needs its own checkout-relative working
# directory rather than a `-p` flag from the repo root.

name: Fuzz

on:
  push:
    branches: [trunk]
  pull_request:
    branches: [trunk]

# Principle of least privilege for the GITHUB_TOKEN (flagged by CodeQL's "Workflow does not
# contain permissions" check): the one job here only checks out the repo, installs cargo-fuzz,
# and runs a bounded local fuzz smoke test -- it never writes to the repo -- so a workflow-wide
# `contents: read` covers it, with no per-job override needed.
permissions:
  contents: read

jobs:
  # Bounded smoke run, not a fuzzing campaign: the question this job answers is "does the target
  # still build and run cleanly against its seed corpus for a minute", not "did we find a new
  # crash today". NFR-QUAL-040 is served by this running continuously across merges over time,
  # not by any single run's duration.
  fuzz-smoke:
    name: fuzz smoke (load_nam, 60s)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/namir-nam/fuzz

      - name: cargo install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: cargo fuzz run load_nam -- -max_total_time=60
        working-directory: crates/namir-nam/fuzz
        run: cargo fuzz run load_nam -- -max_total_time=60

  # M5: NFR-QUAL-040's second named reader ("the preset and state readers"). Same bounded-smoke
  # shape as the job above -- see that job's own comment for why 60s and why this isn't trying to
  # find a new crash today.
  fuzz-smoke-state:
    name: fuzz smoke (read_state, 60s)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/namir-state/fuzz

      - name: cargo install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: cargo fuzz run read_state -- -max_total_time=60
        working-directory: crates/namir-state/fuzz
        run: cargo fuzz run read_state -- -max_total_time=60

  # M7: NFR-QUAL-040's third named reader (`namir-ir`'s WAV/IR header parser, `probe_wav`) --
  # namir-nam and namir-state already had this coverage since M1/M5; namir-ir's own parser was a
  # real, previously-unclosed gap this milestone found and closed. Same bounded-smoke shape as the
  # two jobs above.
  fuzz-smoke-ir:
    name: fuzz smoke (probe_wav, 60s)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/namir-ir/fuzz

      - name: cargo install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: cargo fuzz run probe_wav -- -max_total_time=60
        working-directory: crates/namir-ir/fuzz
        run: cargo fuzz run probe_wav -- -max_total_time=60
