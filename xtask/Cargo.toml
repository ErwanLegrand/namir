[package]
name = "xtask"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
namir-params = { path = "../crates/namir-params" }
# M5: `preset` subcommand writes a sample .namirpreset document for FR-STATE-040's and
# NFR-DOC-010's manual tests (docs/manual-tests/) -- the same "tooling consuming a product crate's
# public API, not a product edge" reasoning this crate's own doc comment already gives for
# depending on namir-params.
namir-core = { path = "../crates/namir-core" }
namir-state = { path = "../crates/namir-state" }
cargo_metadata = "0.19"
walkdir = "2"
# M10 Phase 4(a): `nam-parity` subcommand loads a real, locally-held `.nam` model through
# namir-nam's own public API to compare it against a real reference render -- same "tooling
# consuming a product crate's public API, not a product edge" reasoning as this crate's other
# product-crate dependencies above.
namir-nam = { path = "../crates/namir-nam" }
# `nam-parity` reads WAV files (the probe input and the reference render) as plain f32 samples.
# Pinned to the same "3.5" every other hound consumer in this workspace uses.
hound = "3.5"
# M12: `identity` decodes images/namir.png to regenerate namir-ui's brand-mark alpha blob. An
# **xtask-only** dependency by design -- `xtask` is exempt from D-5.1's layering table and is in
# neither shipped product's dependency graph, so no image decoder reaches `namir-app`/`namir-clap`
# and THIRD-PARTY-NOTICES.md (which lists the `Normal`-kind closure of those two alone) is
# unaffected. Verified after adding it: `cargo run -p xtask -- attribution` still reports the
# notices file up to date, and `cargo tree -e normal -p namir-app -p namir-clap` has no `png` node.
png = "0.17"
